name: Build Pioneer DSP Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v4.5.0
          name: "Pioneer DSP Android v4.5.0 (UI Layout & Equalizer Cockpit Overhaul Edition)"
          body: |
            ## 🎵 Pioneer DSP for Android v4.5.0 — UI Layout & Equalizer Cockpit Overhaul Edition
            
            ### 📦 Direct Download:
            * 📱 **Android APK**: `Pioneer_DSP.apk` (Direct install, 100% free)

            ### ✨ Key Upgrades & Layout Fixes in this Release:
            1. **Dark Abstract Audio-Themed Background**:
               - Replaced oversized, cropped intrinsic logo artwork with a clean obsidian-black (`#070a10`) and titanium-navy (`#0a0f17`) background.
               - Subtle radial acoustic frequency waves (`rgba(0, 229, 255, 0.035)`, `rgba(255, 107, 0, 0.025)`) and dark overlay for maximum readability.
               - 100% pure audio surfaces — zero anime characters or portrait imagery.
               - Explicit sizing and containment constraints (`max-width: 100%`) on all artwork elements.
            2. **Fully Functional & Visible 10-Band Graphic Equalizer Screen**:
               - 10 ISO standard frequency faders (31Hz, 63Hz, 125Hz, 250Hz, 500Hz, 1kHz, 2kHz, 4kHz, 8kHz, 16kHz) with dedicated vertical wrap containers (height 150px) preventing slider collapse.
               - Real-time frequency response curve canvas with neon-cyan curve fill and baseline grid.
               - Quick EQ acoustic profile presets bar (FLAT, BASS BOOST, VOCAL, ROCK/DYNAMIC, CLUB, CONCERT HALL).
               - Todoroki Super Bass dual-stage boost card (80Hz low-shelf + 60Hz punch boost) with quick dB pills (OFF, SUBTLE +4.5dB, PUNCH +9.0dB, MAX +14dB).
               - Treble Brilliance & Clarity card (10kHz high-shelf) with quick pills (FLAT, CRISP +3dB, AIR BOOST +6dB, ULTRA +9dB).
               - 3D Acoustic Reverb Environment card with room selection (Concert Hall, Arena, Cathedral, Studio, Plate) and wet/dry mix slider.
               - Every slider and fader directly modulates the active 32-bit floating point WebAudio & Android hardware `AudioEffect` DSP pipeline.
            3. **Seamless Integrated Now Playing Bottom Deck**:
               - Redesigned from a disconnected floating pill into a unified, integrated player deck docked flush above the cockpit bottom navigation bar.
               - Features micro progress bar, artwork thumbnail, track title, artist name, and tactile play/pause and next transport controls.
            4. **Responsive Viewport & Screen Dimensions**:
               - Strict flexbox column hierarchy (`#app-root` -> `.app-header` -> `.main-viewport` -> `.integrated-bottom-deck`).
               - Dynamic viewport height (`100dvh`) with safe-area insets (`env(safe-area-inset-top)` and `env(safe-area-inset-bottom)`) tailored for OnePlus Nord CE5 (2400x1080 / 20:9) and edge-to-edge Android displays.
               - Tab views scroll smoothly with independent overflow containers, preventing any element overlap or clipping.
          files: |
            Pioneer_DSP.apk
