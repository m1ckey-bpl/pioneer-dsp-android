name: Build Pioneer DSP Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v4.2.0
          name: "Pioneer DSP Android v4.2.0 (Real-Time Online Music Streaming & Live DSP Edition)"
          body: |
            ## 🎵 Pioneer DSP for Android v4.2.0 — Real-Time Online Music Streaming & Live DSP Edition
            
            ### 📦 Direct Download:
            * 📱 **Android APK**: `Pioneer_DSP.apk` (Direct install, 100% free)

            ### ✨ Key Upgrades in this Release:
            1. **Real-Time Online Music Streaming Pipeline**:
               - Streams remote audio directly through 32-bit floating point WebAudio DSP pipeline before audio output:
                 `Authorized Stream -> Transport & Buffer -> Audio Decoder -> Decoded PCM -> Pioneer DSP Engine -> Hardware Output`.
               - All active DSP effects (10-Band EQ, Todoroki Super Bass, Concert Hall Reverb, Limiter) apply audibly to online streams in real time.
            2. **Native Streaming Proxy (CORS & WebAudio Sandbox Bypass)**:
               - Android WebView intercepts `https://pioneer.local/stream?url=` via `MainActivity.java` `shouldInterceptRequest`.
               - Injects permissive CORS (`Access-Control-Allow-Origin: *`) and Range 206 Partial Content support, completely eliminating WebAudio silent muting.
            3. **Curated 24/7 Hi-Fi Live Stations & Custom Stream Input**:
               - 6 hand-picked 24/7 HD live streams calibrated for DSP testing (Philharmonic Concert Hall, 808 Bass Lab, Tokyo Synthwave, Lo-Fi Chillout, Rock Antenne, Secret Agent Jazz).
               - Direct Custom Stream URL player for any live MP3/AAC audio URL.
            4. **Radio Browser Open API Integration**:
               - Instant access to over 40,000 public radio stations worldwide without requiring API keys.
            5. **Smooth Parameter Modulation Without Track Restart**:
               - EQ bands, Todoroki Super Bass, and Concert Hall Reverb parameters modulate smoothly using `setTargetAtTime` without pops, clicks, or track restarts.
            6. **Native Hardware AudioEffect Synchronization**:
               - WebAudio slider movements trigger native `PioneerBridge` sync calls to Android hardware `AudioEffect` sessions.
          files: |
            Pioneer_DSP.apk
