name: Build Pioneer DSP Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | awk -F '"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.VERSION }}
          name: "Pioneer DSP Android v${{ env.VERSION }}"
          generate_release_notes: true
          files: |
            Pioneer_DSP.apk
