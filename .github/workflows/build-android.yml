name: Build Pioneer DSP Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v4.3.0
          name: "Pioneer DSP Android v4.3.0 (iOS Cockpit Re-creation Edition — Pure Dark Titanium Theme)"
          body: |
            ## 🎵 Pioneer DSP for Android v4.3.0 — iOS Cockpit Re-creation Edition (Pure Dark Titanium Theme)
            
            ### 📦 Direct Download:
            * 📱 **Android APK**: `Pioneer_DSP.apk` (Direct install, 100% free)

            ### ✨ Key Upgrades in this Release:
            1. **Faithful iOS Cockpit Parity (6-Tab Navigation)**:
               - **TUNER**: Main DSP cockpit featuring Now Playing banner, Concert Hall master toggle, Rotary Master Volume Dial (with smooth drag/touch angle tracking), Todoroki Super Bass quick-switch, Presets bar, and dynamic 20-band live Spectrum Analyser.
               - **LIBRARY**: Local Music Repository with Android SAF file picker, automatic MediaStore scanner, track list, and instant search.
               - **SPOTIFY**: Spotify Web API Player & hardware AudioEffect integration, Curated Quick Stations, and floating DSP Quick Tuning Bar.
               - **EQ**: 10-Band Graphic Equalizer with ISO standard frequency faders (31Hz, 63Hz, 125Hz, 250Hz, 500Hz, 1kHz, 2kHz, 4kHz, 8kHz, 16kHz) with ±12 dB range, real-time frequency curve preview canvas, and Reset Flat button.
               - **HALL**: Acoustic Reverb Environment selector (Concert Hall, Large Arena, Cathedral, Live Studio, Plate Reverb) with synthetic impulse response convolution and 0–100% Wet/Dry mix slider.
               - **CABIN**: Listening Position Alignment featuring an interactive Car Cabin Visualizer with 4 individual speaker seats (FL, FR, RL, RR) and listening mode presets (ALL SEATS, DRIVER FOCUS, PASSENGER FOCUS) driving WebAudio ChannelDelay and StereoPanner wavefront correction.
            2. **Pure Dark Titanium & Audio Surface UI (Zero Anime Imagery)**:
               - 100% removal of all anime character artwork, manga girl portraits, and face wallpapers.
               - Replaced with the authentic iOS `PioneerTheme` visual identity: deep charcoal, midnight titanium, subtle acoustic wave backgrounds, neon cyan (`#00E5FF`), magenta (`#FE0979`), signature amber-orange (`#FF6B00`), and hi-fi gold (`#F2C440`).
            3. **Modern Android Device Optimization (OnePlus Nord CE5 Safe Area)**:
               - Safe area inset handling (`env(safe-area-inset-bottom)`), responsive bottom cockpit navigation bar, zero control clipping, minimum 44px touch targets.
            4. **Dual DSP Architecture**:
               - 32-bit floating point WebAudio engine for local PCM audio and online streaming.
               - Native Android hardware `AudioEffect` routing (`Equalizer`, `BassBoost`, `PresetReverb`) synchronized with system Spotify playback sessions.
          files: |
            Pioneer_DSP.apk
