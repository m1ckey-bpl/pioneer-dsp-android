name: Build Pioneer DSP Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v4.4.0
          name: "Pioneer DSP Android v4.4.0 (Complete Restoration Edition — MediaStore Auto-Scan, Spotify PKCE, Unified Discovery, Legitimate Downloads & Seeking Glitch Fix)"
          body: |
            ## 🎵 Pioneer DSP for Android v4.4.0 — Complete Restoration & Feature Enhancement Edition
            
            ### 📦 Direct Download:
            * 📱 **Android APK**: `Pioneer_DSP.apk` (Direct install, 100% free)

            ### ✨ Key Upgrades & Regressions Restored in this Release:
            1. **Seeking & Playback Glitch Permanent Fix**:
               - Identified and eliminated the root cause where seeking stopped `AudioBufferSourceNode`, which fired its `onended` event callback and prematurely triggered `playNext()`.
               - Implemented safe `onended = null` detachment prior to calling `stop(0)`.
               - Guarded seek slider thumb synchronization with an `isUserSeeking` state lock so progress timer updates do not fight the user's touch/drag interaction.
            2. **Automatic Local Music Scanning Restored**:
               - On startup, automatically queries Android MediaStore (`MediaStore.Audio.Media.EXTERNAL_CONTENT_URI`) with dynamic Android 13/14 `READ_MEDIA_AUDIO` / `READ_EXTERNAL_STORAGE` permission checks.
               - Indexes title, artist, album, duration, file size, content URI, and real album artwork (`content://media/external/audio/albumart/<albumId>`).
               - Includes instant search, sorting (Title, Artist, Duration, Recent), delete track, and Storage Access Framework (SAF) folder picker.
            3. **Spotify Integration Completely Restored & Repaired**:
               - Implemented full OAuth Authorization Code with PKCE (`loginPKCE()`), SHA-256 verifier/challenge generation, and Android deep-link callback (`pioneerdsp://callback`).
               - Real search querying tracks, artists, albums, and playlists via Spotify Web API.
               - User's saved playlists explorer with real album artwork and track counts.
               - Spotify Connect device discovery and playback transfer (`/v1/me/player/devices`).
               - Native hardware `AudioEffect` session synchronization (`ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION`).
            4. **Unified Online Music Discovery (YouTube Music & 24/7 Live Radio)**:
               - Search across millions of tracks using YouTube Data API v3 and high-speed public gateway fallbacks.
               - Streams audio through native streaming proxy (`https://pioneer.local/stream?url=...`) directly into the 32-bit floating point WebAudio DSP pipeline.
               - 24/7 curated HD audio streams (Philharmonic Concert Hall, 808 Bass Lab, Tokyo Synthwave, Lo-Fi Chillout, Rock Antenne, Secret Agent Jazz).
               - Custom live stream URL player for direct MP3/AAC URLs.
               - Synchronized LRCLIB lyrics with auto-scroll highlighting.
            5. **Legitimate Media Downloader Interface**:
               - Dedicated download manager for direct user-provided audio URLs, podcasts, and Creative Commons open media.
               - Real progress bar and byte counter.
               - Saves downloaded audio into IndexedDB local storage and device storage via `PioneerBridge.saveDownloadedAudio`.
               - Clear DRM compliance badge explaining Spotify/YouTube stream licensing restrictions.
            6. **Audiophile Safety & Device Optimization**:
               - 100% zero demo sounds, beeps, or artificial test tones.
               - AudioBecomingNoisy receiver to pause audio when headphones or Bluetooth audio are disconnected.
               - W3C MediaSession API integration for Android notification shade and lock-screen playback controls.
               - Pure dark titanium & carbon UI with zero anime imagery, optimized for OnePlus Nord CE5.
          files: |
            Pioneer_DSP.apk
