name: Build Pioneer DSP Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v4.1.0
          name: "Pioneer DSP Android v4.1.0 (YouTube Playback & LRCLIB Lyrics Edition)"
          body: |
            ## 🎵 Pioneer DSP for Android v4.1.0 — YouTube Streaming & LRCLIB Lyrics Edition
            
            ### 📦 Direct Download:
            * 📱 **Android APK**: `Pioneer_DSP.apk` (Direct install, 100% free)

            ### ✨ Key Upgrades in this Release:
            1. **YouTube Data API v3 & Streaming Engine**:
               - Integrated YouTube Data API v3 for high-fidelity music search and rich track metadata.
               - Optional Google Cloud API Key configuration in Settings with automatic high-speed public music gateway failover.
               - Authorized audio-streaming source integration.
            2. **HTML5 Audio API + 32-Bit Float WebAudio DSP Pipeline**:
               - Streaming audio connects directly into the Pioneer WebAudio DSP graph.
               - All audio effects (10-Band Graphic EQ, Todoroki Super Bass, Deep Sub-Bass, Concert Hall Reverb, Limiter) apply audibly in real time.
            3. **W3C Media Session API**:
               - Full lock-screen and notification shade controls (Play, Pause, Prev, Next, Scrub/Seek).
               - Live position state telemetry (`navigator.mediaSession.setPositionState`).
            4. **LRCLIB API Synchronized Lyrics**:
               - Real-time lyrics lookup via LRCLIB API (`/api/get` & `/api/search`).
               - Synced lyric line highlighting with smooth auto-scroll.
               - Interactive timestamp jumping on lyric line tap.
            5. **Preserved UI & Performance**:
               - 100% layout integrity across all 5 navigation tabs.
          files: |
            Pioneer_DSP.apk
